<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Palette Lab — Veterm</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --ink: #211f1b;
    --muted: #746e64;
    --line: #d9d3c8;
    --accent: #c0392b;
    --mono: "Sarasa Mono SC", "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --panel: #211f1c;
      --ink: #e4ddd1;
      --muted: #968d80;
      --line: #39342e;
      --accent: #d4553f;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    line-height: 1.6;
    transition: background 0.35s ease, color 0.35s ease;
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 34px clamp(20px, 5vw, 54px) 22px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    margin-bottom: 8px;
    color: var(--accent);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: clamp(2rem, 5vw, 3.6rem);
    font-style: italic;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .intro {
    max-width: 360px;
    color: var(--muted);
    font-size: 0.76rem;
    line-height: 1.7;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.68rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  button.primary:hover { background: #a93226; color: #fff; }
  .hint { color: var(--muted); font-size: 0.62rem; align-self: center; }
  kbd {
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 0.6rem;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    flex: 1;
    min-height: 0;
    padding: clamp(16px, 4vw, 38px);
    gap: clamp(8px, 1.6vw, 18px);
  }
  .swatch {
    display: flex;
    flex-direction: column;
    min-height: 220px;
    border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .swatch:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.12); }
  .swatch .color { flex: 1; min-height: 150px; transition: background 0.35s ease; }
  .swatch .info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 10px 11px;
    border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    background: var(--panel);
    color: var(--ink);
    font-size: 0.66rem;
  }
  .swatch .hex { font-weight: 700; }
  .swatch .role { color: var(--muted); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .swatch.locked .info::after { content: "locked"; color: var(--accent); font-size: 0.55rem; }
  .swatch.copied .info { background: var(--accent); color: #fff; }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px clamp(20px, 5vw, 54px);
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.62rem;
  }
  @media (max-width: 760px) {
    header { padding-top: 24px; }
    .palette { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 14px; }
    .swatch { min-height: 150px; }
    .swatch .color { min-height: 100px; }
  }
  @media (max-width: 430px) {
    .palette { grid-template-columns: 1fr; }
    .swatch { min-height: 110px; }
    .swatch .color { min-height: 68px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Veterm · project sandbox 02</div>
    <h1>Palette Lab</h1>
  </div>
  <div>
    <p class="intro">Generate five-color studies, lock the ones you like, and click a swatch to copy its hex value. Everything is local and impermanent.</p>
    <div class="toolbar" style="margin-top:14px">
      <button class="primary" id="generate" type="button">Generate <kbd>Space</kbd></button>
      <button id="reset" type="button">Reset locks</button>
      <button id="background" type="button">Use in page</button>
      <span class="hint">click a color to copy</span>
    </div>
  </div>
</header>
<main class="palette" id="palette" aria-label="Generated palette"></main>
<footer>
  <span>Palette Lab · an HTML project mounted in <code>content/projects/palette-lab</code></span>
  <span id="status">ready</span>
</footer>
<script>
  const roles = ["ground", "paper", "accent", "muted", "contrast"];
  const palette = document.getElementById("palette");
  const status = document.getElementById("status");
  let colors = [];
  let locked = [false, false, false, false, false];
  let copiedTimer;

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return "#" + [f(0), f(8), f(4)].map(x => Math.round(255 * x).toString(16).padStart(2, "0")).join("");
  }

  function generateColor(index) {
    const base = Math.floor(Math.random() * 360);
    const hue = (base + index * (28 + Math.random() * 18)) % 360;
    const sat = index === 4 ? 68 : 22 + Math.random() * 34;
    const light = [82, 94, 44, 58, 20][index] + (Math.random() * 8 - 4);
    return hslToHex(hue, sat, Math.max(10, Math.min(94, light)));
  }

  function generate() {
    colors = colors.length === 5
      ? colors.map((c, i) => locked[i] ? c : generateColor(i))
      : [0, 1, 2, 3, 4].map(generateColor);
    render();
    status.textContent = "palette " + Math.random().toString(16).slice(2, 8);
  }

  function render() {
    palette.innerHTML = "";
    colors.forEach((color, index) => {
      const swatch = document.createElement("div");
      swatch.className = "swatch" + (locked[index] ? " locked" : "");
      swatch.tabIndex = 0;
      swatch.innerHTML = `
        <div class="color" style="background:${color}"></div>
        <div class="info">
          <span>
            <span class="hex">${color}</span><br>
            <span class="role">${roles[index]}</span>
          </span>
          <span>${locked[index] ? "○" : "●"}</span>
        </div>`;
      swatch.addEventListener("click", () => copy(color, swatch));
      swatch.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          copy(color, swatch);
        }
        if (event.key.toLowerCase() === "l") {
          event.preventDefault();
          locked[index] = !locked[index];
          render();
        }
      });
      swatch.addEventListener("dblclick", () => {
        locked[index] = !locked[index];
        render();
      });
      palette.appendChild(swatch);
    });
  }

  async function copy(color, element) {
    try {
      await navigator.clipboard.writeText(color);
      status.textContent = "copied " + color;
    } catch {
      status.textContent = color;
    }
    element.classList.add("copied");
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => element.classList.remove("copied"), 900);
  }

  document.getElementById("generate").addEventListener("click", generate);
  document.getElementById("reset").addEventListener("click", () => {
    locked = [false, false, false, false, false];
    render();
    status.textContent = "locks cleared";
  });
  document.getElementById("background").addEventListener("click", () => {
    document.documentElement.style.setProperty("--bg", colors[0]);
    document.documentElement.style.setProperty("--panel", colors[1]);
    document.documentElement.style.setProperty("--accent", colors[2]);
    document.documentElement.style.setProperty("--muted", colors[3]);
    document.documentElement.style.setProperty("--ink", colors[4]);
    status.textContent = "page tinted";
  });
  document.addEventListener("keydown", event => {
    if (event.code === "Space" && event.target === document.body) {
      event.preventDefault();
      generate();
    }
  });

  generate();
</script>
</body>
</html>
